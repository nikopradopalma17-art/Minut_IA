name: "Validation Check"

# This workflow runs basic validation checks on PRs and can be run manually
# Use this to verify tests, TypeScript compiler, and Rust tests before merging to main

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation-check:
    name: Validation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tauri.conf.json
        id: get-version
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' frontend/src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
          run_install: false

      - name: Install dependencies
        run: pnpm install
        working-directory: frontend

      - name: Run frontend tests
        run: pnpm test
        working-directory: frontend

      - name: Run TypeScript check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Build llama-helper sidecar
        run: |
          echo "Building llama-helper sidecar (CPU mode)..."
          cargo build --release -p llama-helper

          # Copy binary to binaries directory; the Tauri app's build script
          # requires this sidecar resource to exist even for `cargo test`.
          mkdir -p frontend/src-tauri/binaries
          cp target/release/llama-helper frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu

          echo "Copied llama-helper to frontend/src-tauri/binaries/"
          ls -la frontend/src-tauri/binaries/

      - name: Run cargo test
        run: cargo test
        working-directory: frontend/src-tauri

      - name: Generate validation summary
        run: |
          echo "## Validation Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.get-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Verification Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend tests: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          echo "- TypeScript compilation check: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Cargo tests: ✅ Passed" >> $GITHUB_STEP_SUMMARY

